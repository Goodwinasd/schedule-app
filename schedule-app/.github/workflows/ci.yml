name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r schedule-app/requirements.txt
          pip install -r schedule-app/requirements-dev.txt

      - name: Run tests
        env:
          SCHEDULE_PASSWORD: TestPass123!
        run: |
          cd schedule-app
          python -m pytest tests/ tests/integration/ -v --tb=short -q
