<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Расписание</title>
    <link rel="stylesheet" href="/static/css/style.css?v=14">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <h1 id="header-title" data-action="goHome">Расписание</h1>
                <div class="header-actions">
                    <button id="btn-admin" class="btn btn-ghost" data-action="showAdminPanel" style="display:none">⚙️ Администрирование</button>
                    <button id="btn-login" class="btn btn-ghost" data-action="showLoginModal">🔒 Войти</button>
                    <button id="btn-logout" class="btn btn-ghost" data-action="logout" style="display:none">🚪 Выйти</button>
                </div>
            </div>
        </header>
        <main>
            <div id="home-view">
                <div class="section-block">
                    <h2 class="section-title">Студенты</h2>
                    <div id="groups-grid" class="select-grid"></div>
                </div>
                <div class="section-block">
                    <h2 class="section-title">Преподаватели</h2>
                    <div id="teachers-grid" class="select-grid"></div>
                </div>
                <div class="section-block">
                    <h2 class="section-title">Аудитории</h2>
                    <div id="classrooms-grid" class="select-grid"></div>
                </div>
                <div class="section-block">
                    <h2 class="section-title">Заочное отделение</h2>
                    <div id="distance-grid" class="select-grid"></div>
                </div>
            </div>
            <div id="schedule-view" style="display:none">
                <div id="week-carousel" class="week-carousel"></div>
                <div id="schedule-table-container"></div>
                <div id="admin-panel" class="admin-panel" style="display:none">
                    <button class="btn btn-primary btn-add-day" data-action="showAddWeekModal">
                        ➕ Добавить неделю
                    </button>
                    <button class="btn btn-ghost btn-restore-week" data-action="restoreWeek" style="margin-left:8px">
                        🔄 Восстановить неделю
                    </button>
                    <button class="btn btn-danger btn-restore-week" data-action="deleteWeek" style="margin-left:8px">
                        🗑️ Удалить неделю
                    </button>
                </div>
                <div id="print-panel" class="print-panel">
                    <button class="btn btn-ghost btn-print" data-action="printSchedule">🖨 Печать</button>
                    <button class="btn btn-ghost btn-print" data-action="exportSchedule" data-params='["xlsx"]'>📊 Excel</button>
                    <button class="btn btn-ghost btn-print" data-action="exportSchedule" data-params='["docx"]'>📝 Word</button>
                    <button class="btn btn-ghost btn-print" data-action="exportSchedule" data-params='["pdf"]'>📄 PDF</button>
                </div>
            </div>
            <div id="availability-view" style="display:none">
                <div class="avail-head">
                    <div class="avail-mode-toggle">
                        <button class="btn btn-ghost btn-sm active" id="avail-mode-teacher" data-action="setAvailMode" data-params='["teacher"]'>Преподаватели</button>
                        <button class="btn btn-ghost btn-sm" id="avail-mode-classroom" data-action="setAvailMode" data-params='["classroom"]'>Аудитории</button>
                    </div>
                    <select id="avail-group-filter" class="input" style="max-width:160px" onchange="loadAvailability()"><option value="">Все группы</option></select>
                </div>
                <div id="avail-carousel" class="week-carousel"></div>
                <div class="avail-day-tabs" id="avail-day-tabs"></div>
                <div class="avail-controls">
                    <div class="avail-filters">
                        <label class="checkbox-label">
                            <input type="checkbox" id="avail-free-only" onchange="renderAvailTable()"> Только свободные
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="avail-show-all-periods" onchange="renderAvailTable()"> 7-8 пара
                        </label>
                    </div>
                    <div class="avail-toolbar">
                        <button class="btn btn-ghost btn-sm" id="btn-avail-group-course" data-action="toggleAvailGroupByCourse">📊 По курсам</button>
                        <button class="btn btn-ghost btn-sm" id="btn-avail-heatmap" data-action="toggleAvailHeatmap">🔥 Тепловая карта</button>
                        <button class="btn btn-ghost btn-sm" data-action="exportAvailExcel">📊 Экспорт Excel</button>
                        <button class="btn btn-ghost btn-sm" data-action="exportAvailPDF">📄 Экспорт PDF</button>
                        <button class="btn btn-ghost btn-sm" data-action="closeAvailability">✕ Закрыть</button>
                    </div>
                </div>
                <div id="avail-table-container"></div>
            </div>
        </main>
    </div>
    <div id="modal-overlay" class="modal-overlay" data-action="closeModals"></div>
    <div id="confirm-modal" class="modal" style="display:none">
        <div class="modal-content">
            <h2>Подтверждение</h2>
            <p id="confirm-modal-message" class="modal-confirm-msg"></p>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="confirm-modal-cancel">Отмена</button>
                <button class="btn btn-primary" id="confirm-modal-ok">Подтвердить</button>
            </div>
        </div>
    </div>
    <div id="login-modal" class="modal" style="display:none">
        <div class="modal-content">
            <h2>Вход</h2>
            <input type="password" id="login-password" placeholder="Пароль" class="input">
            <div class="modal-actions">
                <button class="btn btn-ghost" data-action="closeModals">❌ Отмена</button>
                <button class="btn btn-primary" data-action="login">🔒 Войти</button>
            </div>
        </div>
    </div>
    <div id="add-week-modal" class="modal" style="display:none">
        <div class="modal-content modal-wide">
            <h2>Добавить неделю</h2>
            <label class="field-label">Группа</label>
            <div class="field-row">
                <select id="week-group" class="input"></select>
                <button class="btn btn-ghost btn-sm" data-action="quickAddGroup">+</button>
            </div>
            <label class="field-label">Понедельник (дата)</label>
            <input type="date" id="week-start-date" class="input">
            <div class="week-preview" id="week-preview"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" data-action="closeModals">❌ Отмена</button>
                <button class="btn btn-primary" data-action="addWeek">Добавить 6 дней</button>
            </div>
        </div>
    </div>
    <div id="add-lesson-modal" class="modal" style="display:none">
        <div class="modal-content modal-wide">
            <h2>Новый пара</h2>
            <div id="validation-warnings" style="display:none"></div>
            <select id="lesson-period" class="input"></select>
            <label class="field-label">Предмет</label>
            <div class="field-row">
                <select id="lesson-subject" class="input" onchange="validateLesson()"></select>
                <button class="btn btn-ghost btn-sm" data-action="quickAdd" data-params='["subjects", "lesson-subject"]'>+</button>
            </div>
            <label class="field-label">Преподаватель</label>
            <div class="field-row">
                <select id="lesson-teacher" class="input" onchange="validateLesson()"></select>
                <button class="btn btn-ghost btn-sm" data-action="quickAdd" data-params='["teachers", "lesson-teacher"]'>+</button>
            </div>
            <label class="field-label">Аудитория</label>
            <div class="field-row">
                <select id="lesson-classroom" class="input" onchange="validateLesson()"></select>
                <button class="btn btn-ghost btn-sm" data-action="quickAdd" data-params='["classrooms", "lesson-classroom"]'>+</button>
            </div>
            <label class="field-label">Группа</label>
            <div class="field-row">
                <select id="lesson-group" class="input"></select>
                <button class="btn btn-ghost btn-sm" data-action="quickAdd" data-params='["groups", "lesson-group"]'>+</button>
            </div>
            <label class="field-label">Подгруппа</label>
            <select id="lesson-subgroup" class="input">
                <option value="">Вся группа</option>
                <option value="1">Подгруппа 1</option>
                <option value="2">Подгруппа 2</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-danger" id="btn-delete-lesson" style="display:none" data-action="deleteCurrentLesson">Удалить</button>
                <button class="btn btn-ghost" id="btn-add-subgroup" style="display:none" data-action="addSubgroupLesson">+ Подгруппа</button>
                <div style="flex:1"></div>
                <button class="btn btn-ghost" data-action="closeModals">❌ Отмена</button>
                <button class="btn btn-primary" id="btn-save-lesson" data-action="addLesson">Добавить</button>
            </div>
        </div>
    </div>
    <div id="references-modal" class="modal modal-wide modal-admin" style="display:none">
        <div class="modal-content modal-wide">
            <div class="ref-header">
                <h2>⚙️ Администрирование</h2>
                <button class="ref-done" data-action="closeModals">✅ Готово</button>
            </div>
            <div class="admin-tabs" id="admin-tabs">
                <button class="admin-tab active" draggable="true" data-tab="refs" data-action="switchAdminTab" data-params='["refs"]'>Справочники</button>
                <button class="admin-tab" draggable="true" data-tab="trash" data-action="switchAdminTab" data-params='["trash"]'>Корзина</button>
                <button class="admin-tab" draggable="true" data-tab="system" data-action="switchAdminTab" data-params='["system"]'>Система</button>
                <button class="admin-tab" draggable="true" data-tab="availability" data-action="switchAdminTab" data-params='["availability"]'>📅 Окна</button>
            </div>
            <div id="admin-tab-refs" class="admin-tab-content active">
                <div class="ref-grid">
                <div class="ref-section">
                    <h3>Предметы</h3>
                    <div class="ref-list" id="ref-subjects"></div>
                    <div class="field-row">
                        <input type="text" id="ref-subjects-input" placeholder="Новый предмет" class="input">
                        <select id="ref-subjects-teacher" class="input" style="max-width:160px"><option value="">Преподаватель</option></select>
                        <button class="btn btn-primary btn-sm" data-action="addSubject">Добавить</button>
                    </div>
                </div>
                <div class="ref-section">
                    <h3>Преподаватели</h3>
                    <div class="ref-list" id="ref-teachers"></div>
                    <div class="field-row">
                        <input type="text" id="ref-teachers-input" placeholder="ФИО преподавателя" class="input">
                        <input type="text" id="ref-teachers-phone" placeholder="Телефон" class="input" style="max-width:140px">
                        <button class="btn btn-primary btn-sm" data-action="addRefItem" data-params='["teachers", "ref-teachers-input", "ref-teachers"]'>Добавить</button>
                    </div>
                </div>
                <div class="ref-section">
                    <h3>Группы</h3>
                    <div class="ref-list" id="ref-groups"></div>
                    <div class="field-row">
                        <input type="text" id="ref-groups-input" placeholder="Номер группы" class="input" style="max-width:140px">
                        <select id="ref-groups-course" class="input" style="max-width:90px">
                            <option value="1">1 курс</option>
                            <option value="2">2 курс</option>
                            <option value="3">3 курс</option>
                            <option value="4">4 курс</option>
                        </select>
                        <label class="checkbox-label"><input type="checkbox" id="ref-groups-distance"> Заочн.</label>
                        <button class="btn btn-primary btn-sm" data-action="addGroup">Добавить</button>
                    </div>
                    <button class="btn btn-ghost btn-sm" style="margin-top:8px;color:var(--accent)" data-action="advanceCourses">Перевести курсы →</button>
                </div>
                <div class="ref-section">
                    <h3>Аудитории</h3>
                    <div class="ref-list" id="ref-classrooms"></div>
                    <div class="field-row">
                        <input type="text" id="ref-classrooms-input" placeholder="Номер аудитории" class="input">
                        <button class="btn btn-primary btn-sm" data-action="addRefItem" data-params='["classrooms", "ref-classrooms-input", "ref-classrooms"]'>Добавить</button>
                    </div>
                </div>
                </div>
            </div>
            <div id="admin-tab-trash" class="admin-tab-content">
                <h3>Корзина</h3>
                <div id="trash-content"></div>
                <div style="margin-top:12px">
                    <button class="btn btn-danger" data-action="purgeTrash" data-params="[]">Очистить корзину (старше 30 дней)</button>
                </div>
            </div>
            <div id="admin-tab-system" class="admin-tab-content">
                <h3>Диагностика БД</h3>
                <div id="db-health-content"></div>
                <hr style="margin:20px 0;border:none;border-top:1px solid var(--border)">
                <h3>Настройки</h3>
                <div id="settings-content"></div>
                <hr style="margin:20px 0;border:none;border-top:1px solid var(--border)">
                <div id="excluded-dates-content"></div>
            </div>
        </div>
    </div>
    <div id="print-header" class="print-header">
        <h1 id="print-title"></h1>
        <p id="print-subtitle"></p>
    </div>
    <script type="module" src="/static/js/modules/main.js?v=2"></script>
</body>
</html>
